<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sign-up</title>
  
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      width: 80%;
        margin-left: 10%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid black;
      padding: 6px;
      text-align: center;
    }
    fieldset {
      margin-bottom: 20px;
    }
    #viewSection {
      display: none;
    }
    .title {
            color: #5C6AC4;
        }
        label {
             margin: 5%;
        }
    legend {
            background: rgb(255, 255, 255);
            color: rgb(55, 74, 247);
            padding: 5px;
        }
  </style>
</head>

<body>

<h1>Sign-up Page</h1>
<h2>By The Napc</h2>
<form id="signupForm">
  <fieldset>
    <legend>Your Credentials</legend>

    Full Name:
    <input type="text" id="fullname" required><br><br>

    Student ID:
    <input type="number" id="studentId" required><br><br>

    Date of Birth:
    <input type="date" id="dob"><br><br>

    Email:
    <input type="email" id="email"><br><br>

    Phone Number:
    <input type="text" id="phone" required><br><br>

    Grade Level:
    <select id="grade" required>
      <option value="">Choose</option>
      <option>7</option>
      <option>8</option>
      <option>9</option>
      <option>10</option>
      <option>11</option>
      <option>12</option>
    </select><br><br>

    Status:
    <input type="radio" name="status" value="Intern" required> Intern
    <input type="radio" name="status" value="Extern"> Extern<br><br>

    Preferred Club:
    <select id="club" required>
      <option value="">Choose</option>
      <option>Alianti</option>
      <option>Math Club</option>
      <option>Model United Nations</option>
      <option>KIslap</option>
      <option>Exposure</option>
      <option>Likha</option>
    </select><br><br>

    Reason:
    <textarea id="reason" rows="3" required></textarea>
  </fieldset>

  <fieldset>
    <legend>Actions</legend>
    <button type="submit">Submit</button>
    <button type="button" onclick="showSignups()">View Signups</button>
    <input type="reset">
  </fieldset>
</form>

<hr>

<div id="viewSection">
  <h2>View Sign-ups</h2>

  Filter by Club:
  <select id="filterClub">
    <option value="">Choose</option>
    <option>Alianti</option>
    <option>Math Club</option>
    <option>Model United Nations</option>
    <option>KIslap</option>
    <option>Exposure</option>
    <option>Likha</option>
  </select>

  <p id="total"></p>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Grade</th>
        <th>Club</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  let form = document.getElementById("signupForm");
  let viewSection = document.getElementById("viewSection");
  let tableBody = document.getElementById("tableBody");
  let filterClub = document.getElementById("filterClub");
  let total = document.getElementById("total");

  function getSignups() {
    return JSON.parse(localStorage.getItem("signups")) || [];
  }

  function saveSignups(data) {
    localStorage.setItem("signups", JSON.stringify(data));
  }

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    let signups = getSignups();

    let user = {
      name: fullname.value,
      id: studentId.value,
      grade: grade.value,
      club: club.value,
      status: document.querySelector("input[name='status']:checked").value
    };

    signups.push(user);
    saveSignups(signups);

    alert("Signup saved!");
    form.reset();
  });

  function showSignups() {
    viewSection.style.display = "block";
    displayTable(getSignups());
  }

  function displayTable(data) {
    tableBody.innerHTML = "";
    data.forEach(s => {
      tableBody.innerHTML += `
        <tr>
          <td>${s.name}</td>
          <td>${s.id}</td>
          <td>${s.grade}</td>
          <td>${s.club}</td>
          <td>${s.status}</td>
        </tr>
      `;
    });
    total.textContent = "Total Sign-ups: " + data.length;
  }

  filterClub.addEventListener("change", function() {
    let signups = getSignups();
    if (this.value === "All") {
      displayTable(signups);
    } else {
      displayTable(signups.filter(s => s.club === this.value));
    }
  });
</script>
</section>
<script src="index.js"></script>
</body>
</html>
